<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CooperWeb Launcher</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #052e16 0%, #064e3b 55%, #0f172a 100%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        user-select: none;
        overflow: hidden;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 22px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-badge {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, #34d399, #059669);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 18px;
        color: #052e16;
        box-shadow: 0 4px 14px rgba(52, 211, 153, 0.35);
      }
      .logo h1 {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.3px;
      }
      .logo p {
        font-size: 12px;
        color: #94a3b8;
      }
      .ver {
        font-size: 11px;
        color: #64748b;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 3px 9px;
        border-radius: 999px;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
      }
      .card {
        width: 100%;
        max-width: 620px;
        text-align: center;
      }
      .card h2 {
        font-size: 30px;
        font-weight: 900;
        line-height: 1.2;
      }
      .card h2 span {
        color: #34d399;
      }
      .card .sub {
        margin-top: 10px;
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.6;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin: 28px 0;
      }
      .stat {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 14px;
        padding: 14px 8px;
      }
      .stat b {
        display: block;
        font-size: 22px;
        color: #fff;
      }
      .stat span {
        font-size: 11px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      .launch {
        margin-top: 6px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(135deg, #34d399, #059669);
        color: #052e16;
        font-weight: 800;
        font-size: 15px;
        padding: 13px 34px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(52, 211, 153, 0.3);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .launch:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(52, 211, 153, 0.45);
      }
      .launch:active {
        transform: translateY(0);
      }
      .launch svg {
        width: 18px;
        height: 18px;
      }
      .hint {
        margin-top: 16px;
        font-size: 12px;
        color: #64748b;
      }
      footer {
        padding: 12px 22px;
        text-align: center;
        font-size: 11px;
        color: #475569;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      @media (prefers-color-scheme: light) {
        body {
          background: linear-gradient(160deg, #ecfdf5 0%, #d1fae5 55%, #f1f5f9 100%);
          color: #0f172a;
        }
        .logo p,
        .card .sub,
        .stat span,
        .hint {
          color: #64748b;
        }
        .stat {
          background: rgba(255, 255, 255, 0.7);
          border-color: rgba(15, 23, 42, 0.08);
        }
        .stat b {
          color: #0f172a;
        }
        .ver {
          color: #94a3b8;
          border-color: rgba(15, 23, 42, 0.15);
        }
        footer {
          color: #94a3b8;
          border-top-color: rgba(15, 23, 42, 0.08);
        }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="logo">
        <div class="logo-badge">CW</div>
        <div>
          <h1>CooperWeb</h1>
          <p>ECZ Grade 7 companion</p>
        </div>
      </div>
      <span class="ver">v0.1.0</span>
    </div>

    <main>
      <div class="card">
        <h2>Welcome to <span>CooperWeb</span></h2>
        <p class="sub">
          Quizzes, past papers, CooperCard, the Market and the Trading Post —
          all in one desktop client.
        </p>

        <div class="stats">
          <div class="stat"><b id="st-users">–</b><span>Students</span></div>
          <div class="stat"><b id="st-quizzes">–</b><span>Quizzes</span></div>
          <div class="stat"><b id="st-papers">–</b><span>Papers</span></div>
          <div class="stat"><b id="st-results">–</b><span>Results</span></div>
        </div>

        <button class="launch" id="launch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 3l14 9-14 9V3z" />
          </svg>
          Launch CooperWeb
        </button>
        <p class="hint" id="status">The site opens in its own window.</p>
      </div>
    </main>

    <footer>CooperWeb Client — powered by Tauri &amp; WebView2</footer>

    <script src="app.js"></script>
  </body>
</html>
